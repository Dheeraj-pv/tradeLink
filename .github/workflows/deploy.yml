name: Deploy TradeLink

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: tradelink
  ECS_CLUSTER: TradeLink-Cluster
  ECS_SERVICE: tradelink-service-crl6dbas
  ECS_TASK_DEFINITION: tradelink
  CONTAINER_NAME: tradelink

jobs:

  # ========================================
  # 1. Check what changed
  # ========================================
  changes:
    name: Check Changes
    runs-on: ubuntu-latest

    outputs:
      prisma: ${{ steps.filter.outputs.prisma }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check Prisma changes
        id: filter
        run: |
          if git diff --name-only HEAD^ HEAD | grep -E '^prisma/(schema\.prisma|migrations/)' > /dev/null; then
            echo "Prisma changes detected."
            echo "prisma=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Prisma changes detected."
            echo "prisma=false" >> "$GITHUB_OUTPUT"
          fi


  # ========================================
  # 2. Run Prisma migrations
  # ========================================
  migrate:
    name: Run Prisma Migrations
    needs: changes
    if: needs.changes.outputs.prisma == 'true'
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # AWS authentication
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------
      # Login to ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # Build migrator image
      # ----------------------------------------
      - name: Build migrator image
        id: build-migrator
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}-migrator"

          docker build \
            --target migrator \
            -t "$IMAGE" \
            .

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # Push migrator image
      # ----------------------------------------
      - name: Push migrator image
        env:
          IMAGE: ${{ steps.build-migrator.outputs.image }}
        run: |
          docker push "$IMAGE"

      # ----------------------------------------
      # Fetch ECS task definition
      # ----------------------------------------
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query "taskDefinition" \
            --output json \
            > /tmp/task-definition-full.json

      # ----------------------------------------
      # Clean task definition
      # ----------------------------------------
      - name: Clean task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt,
            .tags
          )' \
          /tmp/task-definition-full.json \
          > /tmp/task-definition.json

      # ----------------------------------------
      # Fetch network configuration
      # ----------------------------------------
      - name: Fetch ECS network configuration
        run: |
          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].networkConfiguration.awsvpcConfiguration" \
            --output json \
            > /tmp/awsvpc-configuration.json

      # ----------------------------------------
      # Create migrator task definition
      # ----------------------------------------
      - name: Create migrator task definition
        env:
          MIGRATOR_IMAGE: ${{ steps.build-migrator.outputs.image }}
        run: |
          jq \
            --arg image "$MIGRATOR_IMAGE" \
            '
            .containerDefinitions[0].image = $image
            |
            .containerDefinitions[0].command = [
              "npx",
              "prisma",
              "migrate",
              "deploy"
            ]
            ' \
            /tmp/task-definition.json \
            > /tmp/migrator-task-definition.json

      # ----------------------------------------
      # Register migrator task definition
      # ----------------------------------------
      - name: Register migrator task definition
        id: register-migrator
        run: |
          MIGRATOR_TASK_DEFINITION=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file:///tmp/migrator-task-definition.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "task-definition=$MIGRATOR_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # Run migration
      # ----------------------------------------
      - name: Run Prisma migrations
        env:
          MIGRATOR_TASK_DEFINITION: ${{ steps.register-migrator.outputs.task-definition }}
        run: |
          SUBNETS=$(jq -r '.subnets | join(",")' /tmp/awsvpc-configuration.json)
          SECURITY_GROUPS=$(jq -r '.securityGroups | join(",")' /tmp/awsvpc-configuration.json)
          ASSIGN_PUBLIC_IP=$(jq -r '.assignPublicIp' /tmp/awsvpc-configuration.json)

          NETWORK_CONFIG="awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SECURITY_GROUPS],assignPublicIp=$ASSIGN_PUBLIC_IP}"

          TASK_ARN=$(aws ecs run-task \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$MIGRATOR_TASK_DEFINITION" \
            --network-configuration "$NETWORK_CONFIG" \
            --query "tasks[0].taskArn" \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "Failed to start migration task."
            exit 1
          fi

          echo "Migration task: $TASK_ARN"

          aws ecs wait tasks-stopped \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" \
            --output text)

          echo "Migration exit code: $EXIT_CODE"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Prisma migration failed."
            exit 1
          fi

          echo "Prisma migrations completed successfully."


  # ========================================
  # 3. Build and deploy application
  # ========================================
  deploy:
    name: Build and Deploy
    needs: [changes, migrate]
    if: |
      always() &&
      needs.migrate.result != 'failure' &&
      needs.migrate.result != 'cancelled'
    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # AWS authentication
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------
      # Login to ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # Build application image
      # ----------------------------------------
      - name: Build application image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --target runner \
            -t "$IMAGE" \
            .

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # Push application image
      # ----------------------------------------
      - name: Push application image
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          docker push "$IMAGE"

      # ----------------------------------------
      # Fetch ECS task definition
      # ----------------------------------------
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query "taskDefinition" \
            --output json \
            > /tmp/task-definition-full.json

      # ----------------------------------------
      # Clean task definition
      # ----------------------------------------
      - name: Clean task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt,
            .tags
          )' \
          /tmp/task-definition-full.json \
          > /tmp/task-definition.json

      # ----------------------------------------
      # Update application image
      # ----------------------------------------
      - name: Update container image
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # ----------------------------------------
      # Deploy ECS service
      # ----------------------------------------
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true