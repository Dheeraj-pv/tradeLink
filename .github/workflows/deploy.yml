name: Deploy TradeLink

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: tradelink
  ECS_CLUSTER: TradeLink-Cluster
  ECS_SERVICE: tradelink-service-crl6dbas
  ECS_TASK_DEFINITION: tradelink
  CONTAINER_NAME: tradelink

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # 2. Authenticate to AWS using OIDC
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------
      # 3. Login to ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # 4. Build application image
      # ----------------------------------------
      - name: Build application image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --target runner \
            -t "$IMAGE" \
            .

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # 5. Push application image
      # ----------------------------------------
      - name: Push application image
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          docker push "$IMAGE"

      # ----------------------------------------
      # 6. Build migrator image
      # ----------------------------------------
      - name: Build migrator image
        id: build-migrator
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}-migrator"

          docker build \
            --target migrator \
            -t "$IMAGE" \
            .

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # 7. Push migrator image
      # ----------------------------------------
      - name: Push migrator image
        env:
          IMAGE: ${{ steps.build-migrator.outputs.image }}
        run: |
          docker push "$IMAGE"

      # ----------------------------------------
      # 8. Fetch current ECS task definition
      # ----------------------------------------
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query "taskDefinition" \
            --output json \
            > /tmp/task-definition-full.json

      # ----------------------------------------
      # 9. Fetch ECS service network configuration
      # ----------------------------------------
      - name: Fetch ECS network configuration
        run: |
          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].networkConfiguration.awsvpcConfiguration" \
            --output json \
            > /tmp/network-configuration.json

      # ----------------------------------------
      # 10. Run Prisma migrations
      # ----------------------------------------
      - name: Run Prisma migrations
        id: migration
        env:
          MIGRATOR_IMAGE: ${{ steps.build-migrator.outputs.image }}
        run: |
          echo "Starting migration task..."
          echo "Image: $MIGRATOR_IMAGE"

          TASK_ARN=$(aws ecs run-task \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$ECS_TASK_DEFINITION" \
            --launch-type FARGATE \
            --network-configuration file:///tmp/network-configuration.json \
            --overrides "{
              \"containerOverrides\": [
                {
                  \"name\": \"$CONTAINER_NAME\",
                  \"image\": \"$MIGRATOR_IMAGE\",
                  \"command\": [
                    \"npx\",
                    \"prisma\",
                    \"migrate\",
                    \"deploy\"
                  ]
                }
              ]
            }" \
            --query "tasks[0].taskArn" \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "Failed to start migration task."
            exit 1
          fi

          echo "Migration task started:"
          echo "$TASK_ARN"

          echo "Waiting for migration task to stop..."

          aws ecs wait tasks-stopped \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          echo "Migration task stopped."

          EXIT_CODE=$(aws ecs describe-tasks \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[?name=='$CONTAINER_NAME'].exitCode | [0]" \
            --output text)

          STOP_REASON=$(aws ecs describe-tasks \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].stoppedReason" \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          echo "Migration stop reason: $STOP_REASON"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Prisma migration failed."
            exit 1
          fi

          echo "Prisma migrations completed successfully."

      # ----------------------------------------
      # 11. Remove ECS-generated metadata
      # ----------------------------------------
      - name: Clean task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt,
            .tags
          )' \
          /tmp/task-definition-full.json \
          > /tmp/task-definition.json

      # ----------------------------------------
      # 12. Replace application container image
      # ----------------------------------------
      - name: Update container image
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # ----------------------------------------
      # 13. Deploy new ECS task definition
      # ----------------------------------------
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true