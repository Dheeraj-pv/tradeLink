name: Deploy TradeLink

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: tradelink
  ECS_CLUSTER: TradeLink-Cluster
  ECS_SERVICE: tradelink-service-crl6dbas
  ECS_TASK_DEFINITION: tradelink
  CONTAINER_NAME: tradelink

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v6

      # ----------------------------------------
      # 2. Authenticate to AWS using OIDC
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ----------------------------------------
      # 3. Login to ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # 4. Build application image
      # ----------------------------------------
      - name: Build application image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          docker build \
            --target runner \
            -t "$IMAGE" \
            .

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # 5. Push application image
      # ----------------------------------------
      - name: Push application image
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          docker push "$IMAGE"

      # ----------------------------------------
      # 6. Build migrator image
      # ----------------------------------------
      - name: Build migrator image
        id: build-migrator
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:${IMAGE_TAG}-migrator"

          docker build \
            --target migrator \
            -t "$IMAGE" \
            .

          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # 7. Push migrator image
      # ----------------------------------------
      - name: Push migrator image
        env:
          IMAGE: ${{ steps.build-migrator.outputs.image }}
        run: |
          docker push "$IMAGE"

      # ----------------------------------------
      # 8. Fetch current ECS task definition
      # ----------------------------------------
      - name: Fetch current task definition
        run: |
          aws ecs describe-task-definition \
            --region "$AWS_REGION" \
            --task-definition "$ECS_TASK_DEFINITION" \
            --query "taskDefinition" \
            --output json \
            > /tmp/task-definition-full.json

      # ----------------------------------------
      # 9. Clean task definition
      # ----------------------------------------
      - name: Clean task definition
        run: |
          jq 'del(
            .taskDefinitionArn,
            .revision,
            .status,
            .requiresAttributes,
            .compatibilities,
            .registeredAt,
            .registeredBy,
            .deregisteredAt,
            .tags
          )' \
          /tmp/task-definition-full.json \
          > /tmp/task-definition.json

          echo "Cleaned task definition:"
          cat /tmp/task-definition.json

      # ----------------------------------------
      # 10. Fetch ECS service network configuration
      # ----------------------------------------
      - name: Fetch ECS network configuration
        run: |
          aws ecs describe-services \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].networkConfiguration.awsvpcConfiguration" \
            --output json \
            > /tmp/awsvpc-configuration.json

          echo "Network configuration:"
          cat /tmp/awsvpc-configuration.json

      # ----------------------------------------
      # 11. Create migrator task definition
      # ----------------------------------------
      - name: Create migrator task definition
        env:
          MIGRATOR_IMAGE: ${{ steps.build-migrator.outputs.image }}
        run: |
          jq \
            --arg image "$MIGRATOR_IMAGE" \
            '
            .containerDefinitions[0].image = $image
            |
            .containerDefinitions[0].command = [
              "npx",
              "prisma",
              "migrate",
              "deploy"
            ]
            ' \
            /tmp/task-definition.json \
            > /tmp/migrator-task-definition.json

          echo "Migrator task definition created."

      # ----------------------------------------
      # 12. Register migrator task definition
      # ----------------------------------------
      - name: Register migrator task definition
        id: register-migrator
        run: |
          MIGRATOR_TASK_DEFINITION=$(aws ecs register-task-definition \
            --region "$AWS_REGION" \
            --cli-input-json file:///tmp/migrator-task-definition.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          if [ -z "$MIGRATOR_TASK_DEFINITION" ] || [ "$MIGRATOR_TASK_DEFINITION" = "None" ]; then
            echo "Failed to register migrator task definition."
            exit 1
          fi

          echo "Migrator task definition:"
          echo "$MIGRATOR_TASK_DEFINITION"

          echo "task-definition=$MIGRATOR_TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      # ----------------------------------------
      # 13. Run Prisma migrations
      # ----------------------------------------
      - name: Run Prisma migrations
        env:
          MIGRATOR_TASK_DEFINITION: ${{ steps.register-migrator.outputs.task-definition }}
        run: |
          echo "Starting migration task..."
          echo "Task definition: $MIGRATOR_TASK_DEFINITION"

          NETWORK_CONFIG=$(cat /tmp/awsvpc-configuration.json)

          TASK_ARN=$(aws ecs run-task \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$MIGRATOR_TASK_DEFINITION" \
            --network-configuration "awsvpcConfiguration=$NETWORK_CONFIG" \
            --query "tasks[0].taskArn" \
            --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "Failed to start migration task."
            exit 1
          fi

          echo "Migration task started:"
          echo "$TASK_ARN"

          echo "Waiting for migration task to stop..."

          aws ecs wait tasks-stopped \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN"

          echo "Migration task stopped."

          EXIT_CODE=$(aws ecs describe-tasks \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].containers[0].exitCode" \
            --output text)

          STOP_REASON=$(aws ecs describe-tasks \
            --region "$AWS_REGION" \
            --cluster "$ECS_CLUSTER" \
            --tasks "$TASK_ARN" \
            --query "tasks[0].stoppedReason" \
            --output text)

          echo "Migration exit code: $EXIT_CODE"
          echo "Migration stop reason: $STOP_REASON"

          if [ "$EXIT_CODE" != "0" ]; then
            echo "Prisma migration failed."
            exit 1
          fi

          echo "Prisma migrations completed successfully."

      # ----------------------------------------
      # 14. Update application container image
      # ----------------------------------------
      - name: Update container image
        id: task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: /tmp/task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # ----------------------------------------
      # 15. Deploy new ECS task definition
      # ----------------------------------------
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-definition.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true